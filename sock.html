        async function getPosts(startnum, endnum) {
            let arrayFetching = [];
            for (let i = startnum; i <= endnum; i++) {
                arrayFetching.push("post" + String(i))
            }
            const myQuery = query(
                collection(db, "posts"),
                where(documentId(), "in", arrayFetching)
            )
            const rawData = await getDocs(myQuery);
            const posts = rawData.docs.map((doc) => {
                return {
                    id: doc.id,
                    ...doc.data()
                }
            });
            return posts;
        }

        // ai is used for image function thingy
        let imageForSaving = "";
        imageUpload.onchange = function() {
            const file = imageUpload.files[0];
            if (!file) return;

            const tempImg = new Image();
            const tempUrl = URL.createObjectURL(file);

            tempImg.onload = function() {
                const width = tempImg.naturalWidth;
                const height = tempImg.naturalHeight;

                URL.revokeObjectURL(tempUrl);

                if (width > 1000 || height > 1000) {
                    alert("Image is too big. Max size is 1000x1000 pixels.");
                    imageUpload.value = "";
                    showImage.src = "";
                    imageForSaving = "";
                    return;
                }

                const reader = new FileReader();

                reader.onload = function(event) {
                    imageForSaving = event.target.result;
                    showImage.src = imageForSaving;
                };

                reader.readAsDataURL(file);
            };

            tempImg.src = tempUrl;
        };

        async function postImageFunc() {
            try {
                const recentPostNumRef = doc(db, "posts", "recentPostNum")
                const rawData = await getDoc(doc(db, "posts", "recentPostNum"))
                const data = rawData.data();
                let postNum = data.number + 1;
                let postID = "post" + String(postNum);
                let saveRefForPost = doc(db, "posts", postID)
                let postIDLink = Math.random().toString(36).substring(2, 8);
                await setDoc(saveRefForPost, {
                    author: username,
                    image: imageForSaving,
                    likes: 0,
                    saves: 0,
                    postID: postIDLink,
                    text: textAreaOnPost.value,
                });
                await updateDoc(recentPostNumRef, {
                    number: increment(1)
                })
                await updateDoc(saveRef, {
                    postIds: arrayUnion(postID)
                })
                showImage.src = "";
                textAreaOnPost.value = "";
            } catch (error) {
                console.log("Firebase failed, try posting later...")
                console.error("Post error:", error.code, error.message);
