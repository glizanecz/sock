<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sock Social</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <style>
      body {
        display: flex;
        justify-content: center;
        justify-items: center;
      }

      h1 {
        overflow: auto;
        width: fit-content;
        height: fit-content;
        padding: 10px;
        background-color: rgb(174, 174, 174);
        border-color: black;
        border-radius: 10px;
        border-style: solid;
        font-family: 'Trebuchet MS';
        margin-bottom: 10px;
      }

      h1:hover {
        background-color: rgb(171, 171, 171);
      }

      button {
        display: flex;
        align-content: center;
      }

      .interestsDiv {
        width: fit-content;
        height: fit-content;
        padding: 10px;
        margin-bottom: 10px;
        border-color: black;
        border-radius: 10px;
        border-style: solid; 
        font-family: 'Trebuchet MS';
        background-color: rgb(174, 174, 174);
      }
    </style>
    <main>
        <h1>Welcome to Sock Social!</h1>
        <br>
        <div class="interestsDiv">
          <h2>What are your interests?</h2>
          <h3>Select all that apply!</h3>
          <button>I am an artist!</button>
          <br>
          <button>I am a programmer!</button>
          <br>
          <button>I am nothing.</button>
        </div>
        <br>
        <button>Create Feed</button>
    </main>
    <script src="index.js"></script>
  </body>
</html>
