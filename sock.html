<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sock Social</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <style>
    
      body {
          display: grid;
          place-items: center;
      }
      
      h1 {
        display: grid;
        place-items: center;
        overflow: auto;
        width: fit-content;
        height: fit-content;
        padding: 10px;
        background-color: rgb(225, 163, 83);
        border-color: rgb(196, 124, 35);
        border-radius: 10px;
        border-style: solid;
        font-family: 'Trebuchet MS';
        margin-bottom: 10px;
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
      }

      h1:hover {
        background-color: rgb(155, 90, 34);
      }
      
      button {
        width: fit-content;
        height: fit-content;
        overflow: auto;
        padding: 10px;
        border-color: rgb(198, 126, 17);
        border-radius: 10px;
        border-style: solid; 
        font-family: 'Trebuchet MS';
        background-color: #eead70;
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
      }
      
      .feedBtn {
        width: fit-content;
        height: fit-content;
        overflow: auto;
        padding: 10px;
        border-color: rgb(198, 126, 17);
        border-radius: 10px;
        border-style: solid; 
        font-family: 'Trebuchet MS';
        background-color: #eead70;
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
      }
      
      .feedBtns {
        display: flex;
        flex-direction: column;
        align-content: center;
        gap: 6px;
        justify-content: center;
      }
      
      .feedBtn:hover {
          background-color: orange;
      }
      
      button:hover {
          background-color: orange;
      }

      .interestsDiv {
        display: none; /*change to grid if showing interestsDiv first*/
        place-items: center;
        width: fit-content;
        height: fit-content;
        overflow: auto;
        padding: 10px;
        border-color: rgb(198, 126, 17);
        border-radius: 10px;
        border-style: solid; 
        font-family: 'Trebuchet MS';
        background-color: #eead70;
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
      }
      
      .login {
        display: grid; /*change to grid */
        place-items: center;
        width: fit-content;
        height: fit-content;
        overflow: auto;
        padding: 10px;
        border-color: rgb(198, 126, 17);
        border-radius: 10px;
        border-style: solid; 
        font-family: 'Trebuchet MS';
        background-color: #eead70;  
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
      }
      
      sup {
          cursor: pointer;
          user-select: none;
          -webkit-user-select: none;
          -ms-user-select: none;
      }
      
      .signUp {
        display: none; /*change to grid if you're showing signUp first*/
        place-items: center;
        width: fit-content;
        height: fit-content;
        overflow: auto;
        padding: 10px;
        border-color: rgb(198, 126, 17);
        border-radius: 10px;
        border-style: solid; 
        font-family: 'Trebuchet MS';
        background-color: #eead70;  
      }
      
      .feed {
          display: none; /* change to flex in future code */
          align-items: center;
          justify-content: center;
          flex-direction: row;
          gap: 15px;
          background-color: #eead70;
          width: fit-content;
          height: fit-content;
          padding: 30px;
          border-radius: 10px;
          border: black solid;
      }
      
      img {
          border: black solid;
          border-radius: 10px;
          height: 500px;
          width: 500px;
          object-fit: cover;
      }

      .smallIMG {
        width: 12px;
        height: 12px;
      }

      .feedBarBtn {
        width: fit-content;
        height: fit-content;
        overflow: auto;
        padding: 10px;
        border-color: rgb(198, 126, 17);
        border-radius: 10px;
        border-style: solid; 
        font-family: 'Trebuchet MS';
        background-color: #eead70;
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;  
      }

      .feedBarBtn:hover {
        background-color: orange;
      }

      .feedBar {
        display: none; /* grid */
        place-items: center;
      }

      .userAcc {       
          display: none; /* change to grid */
          place-items: center;   
          background-color: #eead70;
          width: fit-content;
          height: fit-content;
          padding: 30px;
          border-radius: 10px;
          border: black solid;  
          overflow: auto;
      }

      .pfpOnAcc {
        display: grid;
        place-items: center;
        width: fit-content;
        height: fit-content;
        border: none;
        border-radius: 0;
      }

      .usernameOnAcc {
        display: grid;
        place-items: center;
      }
    </style>
    <main>
        <div id="interestsDiv" class="interestsDiv">
          <h1>Welcome to *insert dumb name here*</h1>
          <br>
          <h2>What are your interests?</h2>
          <h3><em><strong>Select all that apply!</strong></em></h3>
          <button id="artistBtn">I am an artist!</button>
          <br>
          <button id="programBtn">I am a programmer!</button>
          <br>
          <button id="nothingBtn">I am nothing.</button>
          <br>
          <br>
          <button onclick="createFeed()">Create Feed</button>
        </div>
        <div id="loginBox" class="login">
            <h1>Login</h1><sup onclick="signUpInstead()">Or Sign Up!</sup>
            <form>
                <label for="loginInput">Email</label>
                <br>
                <input id="userInputLogin" type="text">
                <br>
                <label for="passwordInput">Password</label>
                <br>
                <input id="passwordInputLogin" maxlength="15" type="password">
                <br>
                <br>
                <button type="button" onclick="loginSubmit()">Login</button>
            </form>
        </div>
        <div class="signUp" id="signUpBox">
            <h1>Sign Up</h1><sup onclick="loginInstead()">Or Login!</sup>
            <form>
                <label for="userInputSignUp">Email</label>
                <br>
                <input id="userInputSignUp" type="text">
                <br>
                <label for="passwordInputSignUp">Password</label>
                <br>
                <input id="passwordInputSignUp" maxlength="15" type="password">
                <br>
                <br>
                <button type="button" onclick="signUpSubmit()">Sign Up</button>
            </form>
        </div>
        <div id="feedDiv" class="feed">
            <img id="postShared" src="https://static.vecteezy.com/system/resources/thumbnails/041/166/062/small/ai-generated-hawk-high-quality-image-free-photo.jpg" alt="pic1"> 
            <div class="feedBtns">
                <button class="feedBtn">↑</button>
                <button class="feedBtn" onclick="accBtnClick()"><img class="smallIMG" src="pfp.png"></button>
                <button class="feedBtn">❤️</button>
                <button class="feedBtn">⭐</button>
                <button class="feedBtn">🔄</button>
                <button class="feedBtn">📤</button>   
                <button class="feedBtn">⬇</button>    
            </div>
        </div>
        <div id="post">
            <input id="imageUpload" type="file" accept="image/*">
            <img id="showImage" style="width: fit-content; height: fit-content;">
        </div>
        <div id="feedBar" class="feedBar">
            <button id="createVideo" class="feedBarBtn">➕</button>
        </div>
        <div id="userAcc" class="userAcc">
            <img class="pfpOnAcc" src="pfp.png">
            <h2 class="usernameOnAcc" id="usernameOnAcc">@usernameHere</h1>
        </div>
    </main>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        
        import { 
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            deleteDoc,
            collection,
            addDoc,
            getDocs,
            query,
            where,
            orderBy,
            limit,
            onSnapshot,
            serverTimestamp,
            increment,
            arrayUnion,
            arrayRemove,
            deleteField
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries
        
        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyDiMkSXx7nHxzqvAKIZEkaIo8_nX4YaV-o",
          authDomain: "social-32f89.firebaseapp.com",
          projectId: "social-32f89",
          storageBucket: "social-32f89.firebasestorage.app",
          messagingSenderId: "210185293804",
          appId: "1:210185293804:web:9f24f6b208b135b15efac9",
          measurementId: "G-S788GNK49F"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app)
        const db = getFirestore(app);
        window.currentUserId = null;
        //interests below
        let saveRef = null;
        const interestsDiv = document.getElementById("interestsDiv");
        const artistBtn = document.getElementById("artistBtn");
        const programBtn = document.getElementById("programBtn");
        const nothingBtn = document.getElementById("nothingBtn");
        const feedBar = document.getElementById("feedBar");
        let artist = "0";
        let program = "0";
        let nothing = "0";
        let artistBtnTog = 0;
        let programBtnTog = 0;
        let nothingBtnTog = 0;
        //login stuff below
        const loginBox = document.getElementById("loginBox");
        //sign up stuff below
        const signUpBox = document.getElementById("signUpBox");

        //feed stuff below
        const feed = document.getElementById("feedDiv");
        const imageUpload = document.getElementById("imageUpload");
        const showImage = document.getElementById("showImage")
        //User's Profile
        const userAcc = document.getElementById("userAcc");
        const usernameOnAcc = document.getElementById("usernameOnAcc");
        //userAcc.style.display = "grid";

        let imageForSaving = "";

        imageUpload.onchange = function() {
            const file = imageUpload.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(event) {
                imageForSaving = event.target.result;
                showImage.src = imageForSaving;
            };

            reader.readAsDataURL(file);
        };


        window.signUpInstead = function() {
            loginBox.style.display = "none";
            signUpBox.style.display = "grid";
        }
        
        window.loginInstead = function() {
            signUpBox.style.display = "none";
            loginBox.style.display = "grid";
        }
        
        window.createFeed = function() {
            creatingFeed()
            interestsDiv.style.display = "none";
            feed.style.display = "flex";
            feedBar.style.display = "grid";
        }

        window.accBtnClick = function() {
            feed.style.display = "none";
            feedBar.style.display = "none"
            userAcc.style.display = "grid";
            feedBar.style.display = "grid";
        }
        
        window.loginSubmit = async function() {
            const loginUser = document.getElementById("userInputLogin").value;
            const loginPassword = document.getElementById("passwordInputLogin").value;
            try {
                const userCredential = await signInWithEmailAndPassword(auth, loginUser, loginPassword);
                currentUserId = userCredential.user.uid;
                saveRef = doc(db, "users", currentUserId);
                loginBox.style.display = "none";
                signUpBox.style.display = "none";
                feed.style.display = "flex";;
                feedBar.style.display = "grid";
            } catch (error) {
                console.log("User does not exist.")
            }

            try {
                await createUserDataIfNeeded();
                console.log("feed created")
            } catch (error) {
                console.log("Firestore error with creating data. Feed could not be created.")
                console.error("Firestore Error: ", error.code, error.message);
            }
        }
        
        window.signUpSubmit = async function() {
            const signUpUser = document.getElementById("userInputSignUp").value;
            const signUpPassword = document.getElementById("passwordInputSignUp").value;
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, signUpUser, signUpPassword);
                currentUserId = userCredential.user.uid;
                saveRef = doc(db, "users", currentUserId);
                loginBox.style.display = "none";
                signUpBox.style.display = "none";
                interestsDiv.style.display = "grid";
            } catch (error) {
                console.log("Email Acc Invalid, or User Not Signed Up")
            }
        }
        
        async function creatingFeed() {
            if (artist == 0 && program == 0 && nothing == 0) {
                nothing = 1;
                console.log(artist + program + nothing)
            }

            try {
                await createUserDataIfNeeded();
                console.log("feed created")
            } catch (error) {
                console.log("Firestore error with creating data. Feed could not be created.")
                console.error("Firestore Error: ", error.code, error.message);
            }
        }
        
        artistBtn.onclick = function() {
            nothing = "0";
            nothingBtnTog = 0;
            if (artistBtnTog === 1) {
                artistBtnTog = 0
                artist = "0";
                artistBtn.style.backgroundColor = "#eead70"
            } else {
                artistBtnTog = 1;
                artist = "1";
                artistBtn.style.backgroundColor = "orange";
            }
            nothingBtn.style.backgroundColor = "#eead70"
            console.log(artist + program + nothing)
        }
        programBtn.onclick = function() {
            nothing = "0";
            nothingBtnTog = 0;
            if (programBtnTog === 1) {
                programBtnTog = 0
                program = "0";
                programBtn.style.backgroundColor = "#eead70"
            } else {
                programBtnTog = 1;
                program = "1";
                programBtn.style.backgroundColor = "orange";
            }
            nothingBtn.style.backgroundColor = "#eead70"
            console.log(artist + program + nothing)
        }
        nothingBtn.onclick = function() {
            if (nothingBtnTog === 1) {
                nothingBtnTog = 0;
                nothing = "0";
                nothingBtn.style.backgroundColor = "#eead70"
            } else {
                nothingBtnTog = 1;
                nothing = "1";
                nothingBtn.style.backgroundColor = "orange";
            }
            artist = "0";
            artistBtnTog = 0;
            artistBtn.style.backgroundColor = "#eead70"
            program = "0";
            programBtnTog = 0;
            programBtn.style.backgroundColor = "#eead70"
            console.log(artist + program + nothing)
        }
        
        async function createUserDataIfNeeded() {
            if (currentUserId != null) {
                const userDataRaw = await getDoc(saveRef)
                const data = userDataRaw.exists() ? userDataRaw.data() : {};
                let defaultSave = {
                    interests: (artist + program + nothing),
                    likes: 0,
                    followers: 0,
                    postIds: [],
                    banned: 0,
                    favoritePosts: [],
                    likedPosts: [],
                    username: "username01",
                }

                if (!data.interests) {
                    defaultSave.interests = "001";
                } else {
                    defaultSave.interests = data.interests
                }

                if (!data.likes) {
                    defaultSave.likes = 0;
                } else {
                    defaultSave.likes = data.likes
                }

                if (!data.followers) {
                    defaultSave.followers = 0;
                } else {
                    defaultSave.followers = data.followers;
                }

                if (!data.postIds) {
                    defaultSave.postIds = [];
                } else {
                    defaultSave.postIds = data.postIds
                }

                if (!data.banned) {
                    defaultSave.banned = 0;
                } else {
                    defaultSave.banned = data.banned;
                }

                if (!data.favoritePosts) { 
                    defaultSave.favoritePosts = [];
                } else {
                    defaultSave.favoritePosts = data.favoritePosts;
                }

                if (!data.likedPosts) {
                    defaultSave.likedPosts = [];
                } else {
                    defaultSave.likedPosts = data.likedPosts;
                }

                if (!data.username) {
                    defaultSave.username = "username01";
                } else {
                    defaultSave.username = data.username;
                }

                await setDoc(saveRef, defaultSave)
            } else {
                console.log("Something went wrong...")
            }
        }
    </script>
  </body>
</html>
